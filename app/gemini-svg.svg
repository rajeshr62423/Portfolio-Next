<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- High-Tech Dark Glass Surface -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.98" />
      <stop offset="50%" stop-color="#051f18" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#01140e" stop-opacity="0.98" />
    </linearGradient>

    <!-- Neon Circuit Glow Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="50%" stop-color="#60efff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Cyber Edge Frame Gradient -->
    <linearGradient id="techBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#60efff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Holographic Prism Reflection -->
    <linearGradient id="holoPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00ff87" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern for Matrix/Cyber Look -->
    <pattern id="cyberGrid" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 6 0 L 0 0 0 6" fill="none" stroke="#00ff87" stroke-width="0.3" opacity="0.15" />
    </pattern>
  </defs>

  <!-- Outer Ambient Drop Shadow -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#000000" opacity="0.6" />

  <!-- Base Cyber Card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#cyberBg)" stroke="url(#techBorder)" stroke-width="1.5" />

  <!-- Futuristic Tech Grid Backdrop -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="url(#cyberGrid)" />

  <!-- Circuit Trace Lines & Nodes -->
  <path d="M 6 16 L 16 16 L 22 10" fill="none" stroke="#00ff87" stroke-width="1" stroke-linecap="round" opacity="0.4" />
  <circle cx="6" cy="16" r="1.5" fill="#00ff87" opacity="0.7" />

  <path d="M 58 48 L 48 48 L 42 54" fill="none" stroke="#60efff" stroke-width="1" stroke-linecap="round" opacity="0.4" />
  <circle cx="58" cy="48" r="1.5" fill="#60efff" opacity="0.7" />

  <!-- Corner Tech HUD Accents -->
  <path d="M 6 10 L 6 6 L 10 6" fill="none" stroke="#00ff87" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 58 10 L 58 6 L 54 6" fill="none" stroke="#00ff87" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 6 54 L 6 58 L 10 58" fill="none" stroke="#00ff87" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 58 54 L 58 58 L 54 58" fill="none" stroke="#00ff87" stroke-width="1.5" stroke-linecap="round" />

  <!-- Holographic Glass Flare Reflection -->
  <path d="M 3.5 16 C 3.5 9 9 3.5 16 3.5 L 48 3.5 C 55 3.5 60.5 9 60.5 16 L 60.5 24 C 38 30 18 22 3.5 38 Z" fill="url(#holoPrism)" />

  <!-- High-Tech Vector Code Brackets (< >) -->
  <path d="M 11 27 L 7 32 L 11 37" fill="none" stroke="#00ff87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 53 27 L 57 32 L 53 37" fill="none" stroke="#00ff87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Mirrored RR Emblem (Cyber Neon Text Glow) -->
  <g font-family="Consolas, 'Fira Code', 'JetBrains Mono', monospace" font-weight="800" font-size="21">
    <!-- Left R (Mirrored) -->
    <text x="-29" y="34" dominant-baseline="central" text-anchor="middle" transform="scale(-1, 1)" fill="url(#neonGlow)">
      R
    </text>
    <!-- Right R (Normal) -->
    <text x="35" y="34" dominant-baseline="central" text-anchor="middle" fill="url(#neonGlow)">
      R
    </text>
  </g>

  <!-- Glowing Telemetry Status Node (Pulsing Green) -->
  <circle cx="45" cy="40" r="2" fill="#00ff87" />
  <circle cx="45" cy="40" r="3.5" fill="none" stroke="#00ff87" stroke-width="0.75" opacity="0.6" />
</svg>
